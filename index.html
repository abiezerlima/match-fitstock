<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Match de Oportunidades Fitstock</title>

    <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f8fafc;
            color: #1e293b;
        }

        #header-info {
            margin-bottom: 20px;
        }

        #loading {
            display: none;
            padding: 20px;
            text-align: center;
        }

        #error {
            display: none;
            padding: 15px;
            border-radius: 8px;
            background: #fee2e2;
            color: #991b1b;
        }

        #results {
            display: none;
        }
    </style>
</head>

<body>

    <div id="header-info">
        Carregando...
    </div>

    <div id="loading">
        Buscando empresas compatíveis...
    </div>

    <div id="error"></div>

    <div id="results"></div>

    <script>
        let currentOppId = null;

        function log(msg, data) {
            console.log("[MATCH FITSTOCK]", msg, data || "");
        }

        function mostrarErro(msg) {
            document.getElementById("loading").style.display = "none";

            const error = document.getElementById("error");

            error.style.display = "block";
            error.innerHTML = msg;
        }

        function extrairIdDaUrl() {
            const url = window.location.href;

            log("URL atual:", url);

            const match = url.match(
                /[?&](?:recordId|id|EntityId)=([^&]+)/i
            );

            if (match && match[1]) {
                return decodeURIComponent(match[1]);
            }

            return null;
        }

        function carregarEmpresas() {

            if (!currentOppId) {
                mostrarErro("ID da Oportunidade não encontrado.");
                return;
            }

            log("ID da oportunidade:", currentOppId);

            document.getElementById("header-info").innerHTML =
                "<strong>Match Fitstock</strong><br>" +
                "Oportunidade: " + currentOppId;

            document.getElementById("loading").style.display = "block";

            log("Chamando standalone.BuscarEmpresasWidget");

            ZOHO.CRM.FUNCTIONS.execute(
                "standalone.BuscarEmpresasWidget",
                {
                    arguments: JSON.stringify({
                        oppId: currentOppId
                    })
                }
            )
            .then(function(response) {

                log("Resposta da função:", response);

                document.getElementById("loading").style.display = "none";

                if (!response) {
                    mostrarErro("A função não retornou nenhuma resposta.");
                    return;
                }

                if (response.code && response.code !== "success") {
                    mostrarErro(
                        "Erro ao executar a função: " +
                        JSON.stringify(response)
                    );
                    return;
                }

                let output = response.details
                    ? response.details.output
                    : null;

                if (!output) {
                    mostrarErro(
                        "A função foi executada, mas não retornou dados."
                    );
                    return;
                }

                let dados;

                try {
                    dados = typeof output === "string"
                        ? JSON.parse(output)
                        : output;
                }
                catch (e) {
                    mostrarErro(
                        "Não foi possível interpretar o retorno da função."
                    );

                    console.error(e);
                    return;
                }

                log("Dados processados:", dados);

                if (dados.status === "error") {
                    mostrarErro(dados.message || "Erro desconhecido.");
                    return;
                }

                renderizarResultados(dados);
            })
            .catch(function(error) {

                console.error(
                    "[MATCH FITSTOCK] Erro na função:",
                    error
                );

                mostrarErro(
                    "Erro ao executar BuscarEmpresasWidget.<br><br>" +
                    "<small>" +
                    JSON.stringify(error) +
                    "</small>"
                );
            });
        }

        function renderizarResultados(dados) {

            const results = document.getElementById("results");

            results.style.display = "block";

            if (!dados.empresas || dados.empresas.length === 0) {

                results.innerHTML = `
                    <div style="
                        background:#fff;
                        border-radius:10px;
                        padding:20px;
                        border:1px solid #e2e8f0;
                    ">
                        <strong>Nenhuma empresa encontrada.</strong>
                        <p>
                            Produto:
                            ${dados.produto_nome || "-"}
                        </p>
                    </div>
                `;

                return;
            }

            let html = `
                <div style="
                    background:#fff;
                    border-radius:10px;
                    padding:20px;
                    border:1px solid #e2e8f0;
                ">

                    <h2 style="margin-top:0;">
                        Empresas encontradas
                    </h2>

                    <p>
                        <strong>Produto:</strong>
                        ${dados.produto_nome || "-"}
                    </p>

                    <p>
                        <strong>Tipo:</strong>
                        ${dados.tipo_oportunidade || "-"}
                    </p>

                    <p>
                        <strong>Total:</strong>
                        ${dados.total_encontrados || 0}
                    </p>

                    <hr>

            `;

            dados.empresas.forEach(function(emp) {

                html += `
                    <div style="
                        padding:15px 0;
                        border-bottom:1px solid #e2e8f0;
                    ">

                        <strong>
                            ${emp.empresa_nome || "-"}
                        </strong>

                        <div style="
                            margin-top:6px;
                            font-size:14px;
                            color:#64748b;
                        ">
                            Contato:
                            ${emp.contato_nome || "-"}
                        </div>

                        <div style="
                            margin-top:4px;
                            font-size:14px;
                            color:#64748b;
                        ">
                            Telefone:
                            ${emp.telefone || "-"}
                        </div>

                    </div>
                `;
            });

            html += `</div>`;

            results.innerHTML = html;
        }

        function inicializarWidget() {

            log("Iniciando widget...");

            let tentativas = 0;
            const maxTentativas = 25;

            const intervalo = setInterval(function() {

                tentativas++;

                log(
                    "Aguardando ZOHO.embeddedApp...",
                    tentativas + "/" + maxTentativas
                );

                if (
                    typeof ZOHO !== "undefined" &&
                    ZOHO.embeddedApp
                ) {

                    clearInterval(intervalo);

                    log("ZOHO.embeddedApp encontrado.");

                    ZOHO.embeddedApp.on(
                        "PageLoad",
                        function(data) {

                            log("PageLoad recebido:", data);

                            if (
                                data &&
                                data.EntityId
                            ) {

                                currentOppId = data.EntityId;

                                log(
                                    "EntityId encontrado:",
                                    currentOppId
                                );

                                carregarEmpresas();

                            } else {

                                log(
                                    "PageLoad não trouxe EntityId."
                                );

                                // Fallback para a URL
                                currentOppId = extrairIdDaUrl();

                                if (currentOppId) {
                                    carregarEmpresas();
                                } else {
                                    mostrarErro(
                                        "ID da Oportunidade não localizado."
                                    );
                                }
                            }
                        }
                    );

                    log("Inicializando ZOHO.embeddedApp...");

                    ZOHO.embeddedApp.init();

                } else if (tentativas >= maxTentativas) {

                    clearInterval(intervalo);

                    log(
                        "ZOHO.embeddedApp não ficou disponível."
                    );

                    mostrarErro(
                        "Não foi possível inicializar o SDK do Zoho CRM."
                    );
                }

            }, 200);
        }

        document.addEventListener(
            "DOMContentLoaded",
            inicializarWidget
        );
    </script>

</body>

</html>
