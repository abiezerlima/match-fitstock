<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Fitstock - Produção</title>

    <!-- ZOHO CRM WIDGET SDK -->
    <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f5f6f8;
            color: #202124;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            background: #ffffff;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid #e2e5e9;
        }
        .header h1 { margin: 0 0 8px 0; font-size: 22px; font-weight: 600; }
        .header p { margin: 0; color: #6b7280; font-size: 14px; }
        .status {
            margin-top: 15px;
            padding: 12px 14px;
            border-radius: 7px;
            background: #f1f5f9;
            font-size: 14px;
        }
        .status.success { background: #ecfdf5; color: #065f46; }
        .status.error { background: #fef2f2; color: #991b1b; }
        .status.loading { background: #eff6ff; color: #1e40af; }
        .results {
            background: #ffffff;
            border: 1px solid #e2e5e9;
            border-radius: 10px;
            overflow: hidden;
        }
        .results-header {
            padding: 16px 20px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .results-header h2 { margin: 0; font-size: 17px; font-weight: 600; }
        .count { font-size: 13px; color: #6b7280; }
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th {
            background: #f8fafc;
            text-align: left;
            padding: 12px 16px;
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            border-bottom: 1px solid #e5e7eb;
            text-transform: uppercase;
        }
        td { padding: 13px 16px; font-size: 14px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        .empty { padding: 40px 20px; text-align: center; color: #6b7280; }
        .tag {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 5px;
            background: #f1f5f9;
            color: #475569;
            font-size: 12px;
        }
        select.contact-select {
            width: 100%;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            background: #fff;
            font-size: 13px;
        }
        .action-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .btn-action {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
        .btn-action:hover { background: #1d4ed8; }
        .btn-usa {
            background: #10b981;
            color: #fff;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
        .btn-usa:hover { background: #059669; }
        .btn-nao-usa {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
        .btn-nao-usa:hover { background: #dc2626; }
        .status-badge {
            font-size: 11px;
            padding: 3px 6px;
            border-radius: 4px;
            font-weight: 600;
            display: none;
        }
        .debug {
            margin-top: 16px;
            background: #111827;
            color: #d1d5db;
            border-radius: 10px;
            padding: 15px;
            font-family: Consolas, Monaco, monospace;
            font-size: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .debug-title { color: #ffffff; font-weight: 600; margin-bottom: 8px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Match Fitstock (v3.0 - Produção)</h1>
        <p>Identificação de empresas, registro de inteligência e criação de negociação.</p>
        <div id="status" class="status loading">Inicializando widget...</div>
    </div>

    <div class="results">
        <div class="results-header">
            <h2>Empresas encontradas</h2>
            <div id="count" class="count">0 empresas</div>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Empresa</th>
                        <th>Contato Selecionado</th>
                        <th>Telefone</th>
                        <th>Subcategoria</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="resultsBody">
                    <tr>
                        <td colspan="5" class="empty">Aguardando carregamento...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="debug">
        <div class="debug-title">Debug Log</div>
        <div id="debug">Inicializando...</div>
    </div>
</div>

<script>
    const FUNCTION_API_NAME = "buscarempresaswidget";

    let currentOppId = null;
    let contextData = null;

    const statusElement = document.getElementById("status");
    const debugElement = document.getElementById("debug");
    const resultsBody = document.getElementById("resultsBody");
    const countElement = document.getElementById("count");

    function log(message) {
        const time = new Date().toLocaleTimeString("pt-BR");
        const text = "[" + time + "] " + message;
        console.log(text);
        debugElement.textContent += "\n" + text;
    }

    function setStatus(message, type) {
        statusElement.textContent = message;
        statusElement.className = "status " + type;
    }

    function escapeHtml(value) {
        if (!value) return "";
        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function renderResults(empresas) {
        if (!empresas || !Array.isArray(empresas) || empresas.length === 0) {
            resultsBody.innerHTML = `
                <tr>
                    <td colspan="5" class="empty">Nenhuma empresa encontrada para as subcategorias.</td>
                </tr>
            `;
            countElement.textContent = "0 empresas";
            return;
        }

        countElement.textContent = empresas.length === 1 ? "1 empresa" : empresas.length + " empresas";

        resultsBody.innerHTML = empresas.map(function(empresa) {
            let optionsHtml = "";
            if (empresa.contatos && empresa.contatos.length > 0) {
                optionsHtml = empresa.contatos.map(function(ct) {
                    return `<option value="${ct.id}" data-nome="${escapeHtml(ct.nome)}">${escapeHtml(ct.nome)}</option>`;
                }).join("");
            } else {
                optionsHtml = `<option value="">Nenhum contato cadastrado</option>`;
            }

            return `
                <tr>
                    <td><strong>${escapeHtml(empresa.nome)}</strong></td>
                    <td>
                        <select class="contact-select" id="select_contact_${empresa.id}">
                            ${optionsHtml}
                        </select>
                    </td>
                    <td>${escapeHtml(empresa.telefone)}</td>
                    <td><span class="tag">${escapeHtml(empresa.subcategoria)}</span></td>
                    <td>
                        <div class="action-group">
                            <button class="btn-usa" title="Registrar que usa o produto" onclick="registrarUso('${empresa.id}', 'Usa')">
                                Usa
                            </button>
                            <button class="btn-nao-usa" title="Registrar que não usa o produto" onclick="registrarUso('${empresa.id}', 'Não Usa')">
                                Não Usa
                            </button>
                            <button class="btn-action" title="Criar nova Oportunidade" onclick="criarNegociacao('${empresa.id}', '${escapeHtml(empresa.nome)}')">
                                Criar Negociação
                            </button>
                        </div>
                        <span id="badge_${empresa.id}" class="status-badge"></span>
                    </td>
                </tr>
            `;
        }).join("");
    }

    async function registrarUso(empresaId, statusUso) {
        if (!contextData || !contextData.produto_id) {
            alert("Informações do produto de interesse não disponíveis.");
            return;
        }

        log("Registrando Inteligência de Mercado: Empresa " + empresaId + " -> Status: " + statusUso);
        setStatus("Registrando status na Conta e no Inteligência de Mercado...", "loading");

        const payload = {
            empresa_id: empresaId,
            produto_id: contextData.produto_id,
            status_uso: statusUso,
            opp_id: currentOppId
        };

        const reqData = {
            arguments: JSON.stringify({
                action: "registrar_uso",
                payload: payload
            })
        };

        try {
            const response = await ZOHO.CRM.FUNCTIONS.execute(FUNCTION_API_NAME, reqData);

            let outputRaw = response.output || (response.details && response.details.output);
            let output = outputRaw;

            if (typeof outputRaw === "string") {
                try { output = JSON.parse(outputRaw); } catch (e) {}
            }

            if (output && output.status === "success") {
                setStatus("Status (" + statusUso + ") gravado com sucesso!", "success");
                log("Sucesso ao gravar inteligência para a empresa " + empresaId);

                const badge = document.getElementById("badge_" + empresaId);
                if (badge) {
                    badge.textContent = "Status: " + statusUso;
                    badge.style.display = "inline-block";
                    badge.style.background = statusUso === "Usa" ? "#d1fae5" : "#fee2e2";
                    badge.style.color = statusUso === "Usa" ? "#065f46" : "#991b1b";
                }
            } else {
                throw new Error((output && output.message) || "Falha ao gravar inteligência.");
            }

        } catch (err) {
            log("Erro ao registrar inteligência: " + err.message);
            setStatus("Erro ao salvar status de uso.", "error");
        }
    }

    async function criarNegociacao(empresaDestinoId, empresaDestinoNome) {
        if (!contextData) {
            alert("Dados de contexto não carregados.");
            return;
        }

        const selectElement = document.getElementById("select_contact_" + empresaDestinoId);
        const contatoDestinoId = selectElement ? selectElement.value : null;

        if (!contatoDestinoId) {
            alert("Por favor, selecione um contato para a negociação.");
            return;
        }

        setStatus("Criando negociação no CRM...", "loading");

        let sellerAccountId = "", sellerAccountName = "";
        let sellerContactId = "";
        let buyerAccountId = "", buyerAccountName = "";
        let buyerContactId = "";

        const tipoOpp = (contextData.tipo_oportunidade || "").toLowerCase();

        if (tipoOpp === "venda" || tipoOpp === "sales") {
            sellerAccountId = contextData.empresa_origem_id;
            sellerAccountName = contextData.empresa_origem_nome;
            sellerContactId = contextData.contato_origem_id;

            buyerAccountId = empresaDestinoId;
            buyerAccountName = empresaDestinoNome;
            buyerContactId = contatoDestinoId;
        } else {
            buyerAccountId = contextData.empresa_origem_id;
            buyerAccountName = contextData.empresa_origem_nome;
            buyerContactId = contextData.contato_origem_id;

            sellerAccountId = empresaDestinoId;
            sellerAccountName = empresaDestinoNome;
            sellerContactId = contatoDestinoId;
        }

        const dealName = `[${contextData.produto_nome}] ${sellerAccountName} x ${buyerAccountName}`;

        const payloadCriacao = {
            "Deal_Name": dealName,
            "Nome_Produto": contextData.produto_id ? { "id": contextData.produto_id } : null,
            "Account_Name": sellerAccountId ? { "id": sellerAccountId } : null,
            "Contact_Name": sellerContactId ? { "id": sellerContactId } : null,
            "Empresa_Buyer": buyerAccountId ? { "id": buyerAccountId } : null,
            "Comprador1": buyerContactId ? { "id": buyerContactId } : null
        };

        const reqData = {
            arguments: JSON.stringify({
                action: "criar_negocio",
                payload: payloadCriacao
            })
        };

        try {
            log("Disparando criação de registro via Deluge...");
            const response = await ZOHO.CRM.FUNCTIONS.execute(FUNCTION_API_NAME, reqData);

            let outputRaw = response.output || (response.details && response.details.output);
            let output = outputRaw;

            if (typeof outputRaw === "string") {
                try { output = JSON.parse(outputRaw); } catch (e) {}
            }

            if (output && output.status === "success" && output.deal_id) {
                setStatus("Negociação criada com sucesso! Redirecionando...", "success");
                log("Sucesso! ID da Negociação: " + output.deal_id);

                ZOHO.CRM.UI.Record.open({
                    Entity: "Deals",
                    RecordID: output.deal_id
                });
            } else {
                throw new Error((output && output.message) || "Erro ao criar negociação.");
            }

        } catch (err) {
            log("Erro ao criar negociação: " + err.message);
            setStatus("Erro ao criar negociação no CRM.", "error");
        }
    }

    async function carregarEmpresas() {
        if (!currentOppId) {
            log("ERRO: currentOppId não definido.");
            setStatus("Oportunidade não identificada.", "error");
            return;
        }

        log("carregarEmpresas() com oppId = " + currentOppId);
        setStatus("Buscando empresas compatíveis...", "loading");

        const reqData = {
            arguments: JSON.stringify({ oppId: currentOppId })
        };

        try {
            const response = await ZOHO.CRM.FUNCTIONS.execute(FUNCTION_API_NAME, reqData);

            let outputRaw = response.output || (response.details && response.details.output);
            let output = outputRaw;

            if (typeof outputRaw === "string") {
                try { output = JSON.parse(outputRaw); } catch (e) {}
            }

            if (output && output.status === "error") {
                throw new Error(output.message || "Erro retornado do Deluge.");
            }

            if (output && Array.isArray(output.empresas)) {
                contextData = output;
                renderResults(output.empresas);
                setStatus("Busca concluída com sucesso.", "success");
            } else {
                renderResults([]);
                setStatus("Nenhuma empresa encontrada.", "success");
            }

        } catch (error) {
            log("ERRO em FUNCTIONS.execute: " + JSON.stringify(error));
            setStatus("Erro ao carregar os dados.", "error");
        }
    }

    function registrarZoho() {
        if (typeof ZOHO === "undefined") {
            setTimeout(registrarZoho, 200);
            return;
        }

        ZOHO.embeddedApp.on("PageLoad", function(data) {
            log("PageLoad disparado.");
            currentOppId = data && data.EntityId ? data.EntityId : null;
            if (currentOppId) carregarEmpresas();
        });

        ZOHO.embeddedApp.init();
    }

    log("Widget v3.0 (Produção) carregado.");
    registrarZoho();
</script>
</body>
</html>
