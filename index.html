<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match de Oportunidades Fitstock</title>
    <!-- CDN OFICIAL E ATUALIZADA DO ZOHO CRM SDK -->
    <script src="https://js.zohostatic.com/zohocrm/v2/sdk/1.0.0/sdk.js"></script>
    <style>
        :root {
            --fitstock-green: #28a745;
            --fitstock-green-hover: #218838;
            --fitstock-dark: #1e293b;
            --fitstock-light: #f8fafc;
            --fitstock-border: #e2e8f0;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 10px; 
            background-color: var(--fitstock-light); 
            color: #334155; 
        }

        .fitstock-card { 
            background: #ffffff; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); 
            border: 1px solid var(--fitstock-border);
            padding: 18px; 
        }

        .fitstock-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--fitstock-border);
            padding-bottom: 12px;
            margin-bottom: 14px;
        }

        .fitstock-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--fitstock-dark);
            text-transform: uppercase;
        }

        .badge-fitstock { 
            background: #dcfce7; 
            color: #166534; 
            padding: 4px 8px; 
            border-radius: 4px; 
            font-size: 11px; 
            font-weight: 700; 
            text-transform: uppercase;
        }

        table { 
            width: 100%; 
            border-collapse: separate; 
            border-spacing: 0;
            margin-top: 8px; 
            font-size: 13px; 
        }

        th { 
            background-color: #f1f5f9; 
            text-align: left; 
            padding: 10px 12px; 
            color: #475569; 
            font-weight: 600; 
            border-bottom: 1px solid var(--fitstock-border);
        }

        td { 
            padding: 12px; 
            border-bottom: 1px solid var(--fitstock-border); 
            vertical-align: middle; 
            background-color: #ffffff;
        }

        .btn-fitstock { 
            background-color: var(--fitstock-green); 
            color: #ffffff; 
            border: none; 
            padding: 8px 14px; 
            border-radius: 6px; 
            font-size: 12px; 
            font-weight: 600; 
            cursor: pointer; 
        }

        .btn-fitstock:hover { background-color: var(--fitstock-green-hover); }

        .loading-state { 
            text-align: center; 
            padding: 24px; 
            color: #64748b; 
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="fitstock-card">
    <div class="fitstock-header">
        <div class="fitstock-title">Match de Oportunidades Fitstock</div>
        <div id="header-info"><span class="loading-state">Iniciando busca...</span></div>
    </div>
    
    <table id="tabela-empresas">
        <thead>
            <tr>
                <th>Empresa</th>
                <th>Contato Certo</th>
                <th>Telefone</th>
                <th>Ação</th>
            </tr>
        </thead>
        <tbody>
            <tr><td colspan="4" class="loading-state">Buscando potenciais parceiros...</td></tr>
        </tbody>
    </table>
</div>

<script>
    var currentOppId = null;

    function extrairIdDaUrl() {
        var params = new URLSearchParams(window.location.search);
        var id = params.get("recId") || params.get("crmEntityId") || params.get("id");
        
        if (!id && document.referrer) {
            var matches = document.referrer.match(/\/(\d{15,20})/);
            if (matches && matches[1]) {
                id = matches[1];
            }
        }
        return id;
    }

    function iniciar() {
        currentOppId = extrairIdDaUrl();

        if (currentOppId) {
            carregarEmpresas();
        } else if (typeof ZOHO !== "undefined" && ZOHO.embeddedApp) {
            ZOHO.embeddedApp.on("PageLoad", function(data) {
                if (data && data.EntityId) {
                    currentOppId = data.EntityId;
                    carregarEmpresas();
                }
            });
            ZOHO.embeddedApp.init();
        } else {
            document.getElementById("header-info").innerHTML = "<span style='color:#ef4444;'>ID do Registro não localizado.</span>";
        }
    }

    function carregarEmpresas() {
        document.getElementById("header-info").innerHTML = "<span>Consultando banco de dados...</span>";

        if (typeof ZOHO === "undefined" || !ZOHO.CRM || !ZOHO.CRM.FUNCTIONS) {
            document.getElementById("header-info").innerHTML = "<span style='color:#ef4444;'>SDK do CRM inacessível.</span>";
            return;
        }

        ZOHO.CRM.FUNCTIONS.execute("standalone.BuscarEmpresasWidget", { "oppId": currentOppId })
        .then(function(data) {
            var res = JSON.parse(data.details.output);
            var tbody = document.querySelector("#tabela-empresas tbody");
            var header = document.getElementById("header-info");
            tbody.innerHTML = "";

            if (res.status === "success") {
                header.innerHTML = `<strong>Produto:</strong> ${res.produto_nome} | <span class="badge-fitstock">${res.tipo_oportunidade}</span>`;
                
                if (res.empresas && res.empresas.length > 0) {
                    res.empresas.forEach(function(emp) {
                        var tr = document.createElement("tr");
                        tr.innerHTML = `
                            <td><strong>${emp.empresa_nome}</strong></td>
                            <td>${emp.contato_nome}</td>
                            <td>${emp.telefone || '-'}</td>
                            <td>
                                <button class="btn-fitstock" data-empresa="${emp.empresa_id}" data-contato="${emp.contato_id}">
                                    Criar Negociação
                                </button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });

                    document.querySelectorAll('.btn-fitstock').forEach(function(btn) {
                        btn.addEventListener('click', function() {
                            var empId = this.getAttribute('data-empresa');
                            var ctId = this.getAttribute('data-contato');
                            criarNegociacao(empId, ctId, this);
                        });
                    });

                } else {
                    tbody.innerHTML = `<tr><td colspan="4" class="loading-state">Nenhuma empresa encontrada com Contato Certo.</td></tr>`;
                }
            } else {
                tbody.innerHTML = `<tr><td colspan="4" class="loading-state" style="color:#ef4444;">Erro Backend: ${res.message}</td></tr>`;
            }
        });
    }

    function criarNegociacao(empresaId, contatoId, btn) {
        btn.disabled = true;
        btn.innerText = "Criando...";

        ZOHO.CRM.FUNCTIONS.execute("standalone.criarnegociacaoeorcamento", {
            "oppId": currentOppId,
            "empresaAlvoId": empresaId,
            "contatoAlvoId": contatoId
        })
        .then(function(data) {
            var res = JSON.parse(data.details.output);
            if (res.status === "success") {
                btn.innerText = "Negociação Criada!";
                btn.style.backgroundColor = "#0284c7";
                ZOHO.CRM.UI.Record.open({ Entity: "Deals", RecordID: res.deal_id });
            } else {
                alert("Erro ao criar: " + res.message);
                btn.disabled = false;
                btn.innerText = "Criar Negociação";
            }
        });
    }

    window.addEventListener("DOMContentLoaded", iniciar);
</script>

</body>
</html>
