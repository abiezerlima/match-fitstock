<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Fitstock</title>

    <!-- ZOHO CRM WIDGET SDK -->
    <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f5f6f8;
            color: #202124;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            background: #ffffff;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid #e2e5e9;
        }
        .header h1 { margin: 0 0 8px 0; font-size: 22px; font-weight: 600; }
        .header p { margin: 0; color: #6b7280; font-size: 14px; }
        .status {
            margin-top: 15px;
            padding: 12px 14px;
            border-radius: 7px;
            background: #f1f5f9;
            font-size: 14px;
        }
        .status.success { background: #ecfdf5; color: #065f46; }
        .status.error { background: #fef2f2; color: #991b1b; }
        .status.loading { background: #eff6ff; color: #1e40af; }
        .results {
            background: #ffffff;
            border: 1px solid #e2e5e9;
            border-radius: 10px;
            overflow: hidden;
        }
        .results-header {
            padding: 16px 20px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .results-header h2 { margin: 0; font-size: 17px; font-weight: 600; }
        .count { font-size: 13px; color: #6b7280; }
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th {
            background: #f8fafc;
            text-align: left;
            padding: 12px 16px;
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            border-bottom: 1px solid #e5e7eb;
            text-transform: uppercase;
        }
        td { padding: 13px 16px; font-size: 14px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        .empty { padding: 40px 20px; text-align: center; color: #6b7280; }
        .tag {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 5px;
            background: #f1f5f9;
            color: #475569;
            font-size: 12px;
        }
        select.contact-select {
            width: 100%;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            background: #fff;
            font-size: 13px;
        }
        .btn-action {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 7px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn-action:hover { background: #1d4ed8; }
        .debug {
            margin-top: 16px;
            background: #111827;
            color: #d1d5db;
            border-radius: 10px;
            padding: 15px;
            font-family: Consolas, Monaco, monospace;
            font-size: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .debug-title { color: #ffffff; font-weight: 600; margin-bottom: 8px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Match Fitstock (v2.2)</h1>
        <p>Identificação de empresas por subcategoria e criação de negociação.</p>
        <div id="status" class="status loading">Inicializando widget...</div>
    </div>

    <div class="results">
        <div class="results-header">
            <h2>Empresas encontradas</h2>
            <div id="count" class="count">0 empresas</div>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Empresa</th>
                        <th>Contato Selecionado</th>
                        <th>Telefone</th>
                        <th>Subcategoria</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="resultsBody">
                    <tr>
                        <td colspan="5" class="empty">Aguardando carregamento...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="debug">
        <div class="debug-title">Debug Log</div>
        <div id="debug">Inicializando...</div>
    </div>
</div>

<script>
    const FUNCTION_API_NAME = "buscarempresaswidget";

    let currentOppId = null;
    let contextData = null; // Guarda dados da Oportunidade de Origem retornado pelo Deluge

    const statusElement = document.getElementById("status");
    const debugElement = document.getElementById("debug");
    const resultsBody = document.getElementById("resultsBody");
    const countElement = document.getElementById("count");

    function log(message) {
        const time = new Date().toLocaleTimeString("pt-BR");
        const text = "[" + time + "] " + message;
        console.log(text);
        debugElement.textContent += "\n" + text;
    }

    function setStatus(message, type) {
        statusElement.textContent = message;
        statusElement.className = "status " + type;
    }

    function escapeHtml(value) {
        if (!value) return "";
        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function renderResults(empresas) {
        if (!empresas || !Array.isArray(empresas) || empresas.length === 0) {
            resultsBody.innerHTML = `
                <tr>
                    <td colspan="5" class="empty">Nenhuma empresa encontrada para as subcategorias.</td>
                </tr>
            `;
            countElement.textContent = "0 empresas";
            return;
        }

        countElement.textContent = empresas.length === 1 ? "1 empresa" : empresas.length + " empresas";

        resultsBody.innerHTML = empresas.map(function(empresa) {
            let optionsHtml = "";
            if (empresa.contatos && empresa.contatos.length > 0) {
                optionsHtml = empresa.contatos.map(function(ct) {
                    return `<option value="${ct.id}" data-nome="${escapeHtml(ct.nome)}">${escapeHtml(ct.nome)}</option>`;
                }).join("");
            } else {
                optionsHtml = `<option value="">Nenhum contato cadastrado</option>`;
            }

            return `
                <tr>
                    <td><strong>${escapeHtml(empresa.nome)}</strong></td>
                    <td>
                        <select class="contact-select" id="select_contact_${empresa.id}">
                            ${optionsHtml}
                        </select>
                    </td>
                    <td>${escapeHtml(empresa.telefone)}</td>
                    <td><span class="tag">${escapeHtml(empresa.subcategoria)}</span></td>
                    <td>
                        <button class="btn-action" onclick="criarNegociacao('${empresa.id}', '${escapeHtml(empresa.nome)}')">
                            Criar Negociação
                        </button>
                    </td>
                </tr>
            `;
        }).join("");
    }

    function criarNegociacao(empresaDestinoId, empresaDestinoNome) {
        if (!contextData) {
            alert("Dados de contexto não carregados.");
            return;
        }

        const selectElement = document.getElementById("select_contact_" + empresaDestinoId);
        const contatoDestinoId = selectElement ? selectElement.value : null;
        const selectOption = selectElement ? selectElement.options[selectElement.selectedIndex] : null;
        const contatoDestinoNome = selectOption ? selectOption.getAttribute("data-nome") : "";

        if (!contatoDestinoId) {
            alert("Por favor, selecione um contato válido para a negociação.");
            return;
        }

        let sellerAccountId = "", sellerAccountName = "";
        let sellerContactId = "";
        let buyerAccountId = "", buyerAccountName = "";
        let buyerContactId = "";

        // Lógica de mapeamento dependendo de quem é a Oportunidade de Origem (Venda = Seller / Compra = Buyer)
        const tipoOpp = (contextData.tipo_oportunidade || "").toLowerCase();

        if (tipoOpp === "venda" || tipoOpp === "sales") {
            // A Oportunidade de Origem é SELLER, a empresa encontrada é BUYER
            sellerAccountId = contextData.empresa_origem_id;
            sellerAccountName = contextData.empresa_origem_nome;
            sellerContactId = contextData.contato_origem_id;

            buyerAccountId = empresaDestinoId;
            buyerAccountName = empresaDestinoNome;
            buyerContactId = contatoDestinoId;
        } else {
            // A Oportunidade de Origem é BUYER, a empresa encontrada é SELLER
            buyerAccountId = contextData.empresa_origem_id;
            buyerAccountName = contextData.empresa_origem_nome;
            buyerContactId = contextData.contato_origem_id;

            sellerAccountId = empresaDestinoId;
            sellerAccountName = empresaDestinoNome;
            sellerContactId = contatoDestinoId;
        }

        // Nome Padrão da Oportunidade: "[Nome do Produto] Seller x Buyer"
        const dealName = `[${contextData.produto_nome}] ${sellerAccountName} x ${buyerAccountName}`;

        const recordPayload = {
            "Deal_Name": dealName,
            "Nome_Produto": contextData.produto_id ? { "id": contextData.produto_id } : null,
            "Account_Name": sellerAccountId ? { "id": sellerAccountId } : null,         // Empresa Seller
            "Contact_Name": sellerContactId ? { "id": sellerContactId } : null,         // Nome do Contato (Seller)
            "Empresa_Buyer": buyerAccountId ? { "id": buyerAccountId } : null,          // Empresa Buyer
            "Comprador1": buyerContactId ? { "id": buyerContactId } : null              // Comprador (Contato Buyer)
        };

        log("Disparando ZOHO.CRM.UI.Record.create('Deals'):");
        log(JSON.stringify(recordPayload, null, 2));

        // Abre a janela nativa de criação do Zoho com todos os campos pré-preenchidos
        ZOHO.CRM.UI.Record.create({
            Entity: "Deals",
            RecordData: recordPayload
        });
    }

    async function carregarEmpresas() {
        if (!currentOppId) {
            log("ERRO: currentOppId não definido.");
            setStatus("Oportunidade não identificada.", "error");
            return;
        }

        log("carregarEmpresas() com oppId = " + currentOppId);
        setStatus("Buscando empresas compatíveis...", "loading");

        const reqData = {
            arguments: JSON.stringify({ oppId: currentOppId })
        };

        try {
            const response = await ZOHO.CRM.FUNCTIONS.execute(FUNCTION_API_NAME, reqData);

            let outputRaw = response.output || (response.details && response.details.output);
            let output = outputRaw;

            if (typeof outputRaw === "string") {
                try { output = JSON.parse(outputRaw); } catch (e) {}
            }

            if (output && output.status === "error") {
                throw new Error(output.message || "Erro retornado do Deluge.");
            }

            if (output && Array.isArray(output.empresas)) {
                contextData = output; // Armazena os dados para uso ao clicar no botão
                renderResults(output.empresas);
                setStatus("Busca concluída com sucesso.", "success");
            } else {
                renderResults([]);
                setStatus("Nenhuma empresa encontrada.", "success");
            }

        } catch (error) {
            log("ERRO em FUNCTIONS.execute: " + JSON.stringify(error));
            setStatus("Erro ao carregar os dados.", "error");
        }
    }

    function registrarZoho() {
        if (typeof ZOHO === "undefined") {
            setTimeout(registrarZoho, 200);
            return;
        }

        ZOHO.embeddedApp.on("PageLoad", function(data) {
            log("PageLoad disparado.");
            currentOppId = data && data.EntityId ? data.EntityId : null;
            if (currentOppId) carregarEmpresas();
        });

        ZOHO.embeddedApp.init();
    }

    log("Widget v2.2 carregado na janela.");
    registrarZoho();
</script>
</body>
</html>
